name: Native preview packages
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with:
          version: "11.25.0"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: node scripts/native-package.mjs --configure
      - run: pnpm exec electron-builder --config artifacts/native-builder.json --publish never
      - run: node scripts/native-package.mjs --locate
      - if: runner.os == 'Linux'
        run: xvfb-run -a pnpm exec playwright test tests/e2e/browser.spec.ts tests/e2e/ai-panel-layout.spec.ts
      - if: runner.os == 'macOS'
        run: pnpm exec playwright test tests/e2e/browser.spec.ts tests/e2e/ai-panel-layout.spec.ts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-preview-${{ runner.os }}-${{ runner.arch }}
          path: |
            release/native-*/*.dmg
            release/native-*/*.zip
            release/native-*/*.AppImage
            release/native-*/*.deb
            release/native-*/SHA256SUMS.json
          if-no-files-found: error
          retention-days: 7
# Unsigned test artifacts without Tor. Publish only after native validation/review.
